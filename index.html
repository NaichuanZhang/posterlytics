<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posterlytics | Turn product websites into tracked posters</title>
    <meta
      name="description"
      content="Turn any product website into an on-brand poster, create a distinct tracked QR for every placement, and see what gets scanned."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://posterlytics.insforge.site/" />
    <meta name="theme-color" content="#f2f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171a1b" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://3f9q2998.us-east.insforge.app" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/marketing/photos/picsum-35.webp"
      fetchpriority="high"
    />

    <meta property="og:title" content="Posterlytics | Website to poster. Placement to signal." />
    <meta
      property="og:description"
      content="Turn any product website into an on-brand poster, then track every scan by placement."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://posterlytics.insforge.site/" />
    <meta property="og:site_name" content="Posterlytics" />
    <meta property="og:image" content="https://posterlytics.insforge.site/marketing/social-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Posterlytics landing page with three layered product posters"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Posterlytics | Website to tracked poster" />
    <meta
      name="twitter:description"
      content="Generate on-brand posters and compare every placement's response."
    />
    <meta
      name="twitter:image"
      content="https://posterlytics.insforge.site/marketing/social-card.jpg"
    />

    <style id="first-paint-shell-styles">
      .first-paint-shell,
      .first-paint-noscript {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        min-width: 280px;
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        place-content: center;
        justify-items: center;
        gap: 24px;
        padding: 24px;
        background: #f2f3f0;
        color: #171a1b;
        font-family: Arial, Helvetica, sans-serif;
        letter-spacing: 0;
      }

      .first-paint-shell *,
      .first-paint-noscript * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      .first-paint-brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 15px;
        font-weight: 700;
      }

      .first-paint-brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 3px;
        background: #e94f37;
        color: #ffffff;
        font-size: 18px;
        font-weight: 800;
        line-height: 1;
      }

      .first-paint-progress {
        display: grid;
        justify-items: center;
        gap: 10px;
      }

      .first-paint-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #b9beb8;
        border-top-color: #e94f37;
        border-radius: 50%;
        animation: first-paint-spin 700ms linear infinite;
      }

      .first-paint-label,
      .first-paint-noscript-copy {
        margin: 0;
        color: inherit;
        font-size: 13px;
        line-height: 1.5;
      }

      .first-paint-noscript {
        align-content: center;
        text-align: center;
      }

      .first-paint-noscript-title {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
      }

      @keyframes first-paint-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        .first-paint-shell,
        .first-paint-noscript {
          background: #171a1b;
          color: #f2f3f0;
        }

        .first-paint-spinner {
          border-color: #555b5e;
          border-top-color: #e94f37;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .first-paint-spinner {
          animation: none;
        }
      }
    </style>
    <noscript><style>[data-first-paint-shell]{display:none!important}</style></noscript>
  </head>
  <body>
    <div id="root">
      <div
        id="static-first-paint-shell"
        class="first-paint-shell"
        data-first-paint-shell="static"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading"
      >
        <div class="first-paint-brand" aria-hidden="true">
          <span class="first-paint-brand-mark">P</span>
          <span>Posterlytics</span>
        </div>
        <div class="first-paint-progress">
          <span class="first-paint-spinner" aria-hidden="true"></span>
          <span class="first-paint-label">Loading</span>
        </div>
      </div>
    </div>
    <noscript>
      <main class="first-paint-noscript" data-noscript-fallback>
        <h1 class="first-paint-noscript-title">Posterlytics</h1>
        <p class="first-paint-noscript-copy">
          JavaScript is required to use Posterlytics. Enable JavaScript and reload this page.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
